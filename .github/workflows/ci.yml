name: CI
on:
  push:
    branches: [ main, codex/compiler-stabilization ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.17.1'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential make gdb re2c
          # Optional Python packages for full test functionality
          pip install matplotlib pandas seaborn || echo "Optional packages failed to install"
      - name: Build re2c 3.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP 're2c-3.0.tar.xz'
          $source = Join-Path $env:RUNNER_TEMP 're2c-3.0'
          $build = Join-Path $env:RUNNER_TEMP 're2c-build'
          Invoke-WebRequest -Uri 'https://github.com/skvadrik/re2c/releases/download/3.0/re2c-3.0.tar.xz' `
            -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 5
          $expectedHash = 'B3BABBBB1461E13FE22C630A40C43885EFCFBBBB585830C6F4C0D791CF82BA0B'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $expectedHash) {
            throw 'The re2c 3.0 archive failed SHA-256 verification.'
          }
          tar -xf $archive -C $env:RUNNER_TEMP
          cmake -S $source -B $build -A x64 -DRE2C_BUILD_RE2GO=OFF -DRE2C_BUILD_RE2RUST=OFF
          cmake --build $build --config Release --target re2c --parallel 2
          & (Join-Path $build 're2c.exe') --version
          $build | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install optional Python packages (Windows)
        if: runner.os == 'Windows'
        run: pip install matplotlib pandas seaborn
        continue-on-error: true
      - name: Build DreamCompiler
        run: zig build
      - name: Check Python test runner
        run: python -m unittest discover -s codex/python -p test_test_manager.py
      - name: Run compiler stability regressions
        working-directory: codex/go
        run: go test -count=1 -v -run 'TestCompiler_(DiagnosticExitStatus|ArenaGrowth|WarningsRemainNonfatal|Modules|LoopsAtOptimizationLevels|LiteralEmission|LiteralFailures|MethodArguments|ConstructorArguments|ParserRecovery|PointerParameters|IndexedStrings|LiteralStrings|IdentifierStrings|MemberStrings|ForStrings|CallStrings|AssignedStrings|StringContainers|LoopExitStrings|LoopExitClasses|ConditionalStrings|AssignmentInitializers|AppendedStrings|VoidReturnStrings|VoidReturnClasses|ScalarReturnCleanup|LocalStringReturn|LiteralStringReturn|ConditionalLiteralReturn|ConditionalLocalReturn|BorrowedParameterReturn|ConditionalBorrowedReturn|BorrowedMemberReturn|ConditionalMemberReturn|StaticMemberReturn|ConditionalStaticReturn|OwnedCallInitializer|OwnedCallAssignment|OwnedCallDiscard|OwnedCallArgument|IndexedConsole|Dogfood)$' .
      - name: Cross-compile Windows binary
        if: runner.os == 'Linux'
        run: zig build -Dtarget=x86_64-windows-gnu --prefix build/windows
      - name: Run Dream regression suite
        run: zig build test
