name: CI
on:
  push:
    branches: [ main, codex/compiler-stabilization ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.17.1'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential make gdb re2c
          # Optional Python packages for full test functionality
          pip install matplotlib pandas seaborn || echo "Optional packages failed to install"
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y make mingw re2c
          # Optional Python packages for full test functionality  
          pip install matplotlib pandas seaborn
        continue-on-error: true
      - name: Build DreamCompiler
        run: zig build
      - name: Check Python test runner
        run: python -m unittest discover -s codex/python -p test_test_manager.py
      - name: Run compiler stability regressions
        working-directory: codex/go
        run: go test -count=1 -v -run 'TestCompiler_(DiagnosticExitStatus|ArenaGrowth|WarningsRemainNonfatal|Modules|LoopsAtOptimizationLevels|LiteralEmission|LiteralFailures|MethodArguments|ConstructorArguments|ParserRecovery|PointerParameters|IndexedStrings|LiteralStrings|IdentifierStrings|MemberStrings|IndexedConsole)$' .
      - name: Cross-compile Windows binary
        if: runner.os == 'Linux'
        run: zig build -Dtarget=x86_64-windows-gnu --prefix build/windows
      - name: Run Dream regression suite
        run: zig build test
